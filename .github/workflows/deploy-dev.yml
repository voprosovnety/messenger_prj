name: Deploy → Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, openssl, mbstring, xml, ctype, iconv, tokenizer, intl, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend/app
        run: composer install --no-interaction --no-scripts

      - name: Generate JWT keys
        working-directory: backend/app
        run: |
          mkdir -p config/jwt
          php bin/console lexik:jwt:generate-keypair --skip-if-exists
        env:
          APP_ENV: test

      - name: Run tests
        working-directory: backend/app
        run: php bin/phpunit
        env:
          APP_ENV: test

  deploy:
    name: Deploy to dev
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no root@$SSH_HOST << 'ENDSSH'
          set -e
          cd /opt/messenger-dev
          git fetch origin
          git reset --hard origin/dev
          docker compose -f docker-compose.yml down --remove-orphans 2>/dev/null || true
          COMMIT_SHA=$(git rev-parse HEAD)
          docker compose -f docker-compose.yml build --build-arg CACHE_BUST=$COMMIT_SHA nginx
          docker compose -f docker-compose.yml build php
          docker compose -f docker-compose.yml up -d --remove-orphans
          timeout 60 sh -c 'until docker compose -f docker-compose.yml exec -T php php bin/console about > /dev/null 2>&1; do sleep 3; done'
          docker compose -f docker-compose.yml exec -T php php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          ENDSSH
          rm -f /tmp/deploy_key
