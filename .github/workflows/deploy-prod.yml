name: Deploy → Production

on:
  push:
    branches: [main]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, openssl, mbstring, xml, ctype, iconv, tokenizer, intl, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend/app
        run: composer install --no-interaction --no-scripts

      - name: Generate JWT keys
        working-directory: backend/app
        run: |
          mkdir -p config/jwt
          php bin/console lexik:jwt:generate-keypair --skip-if-exists
        env:
          APP_ENV: test

      - name: Run tests
        working-directory: backend/app
        run: php bin/phpunit
        env:
          APP_ENV: test

  deploy:
    name: Deploy to prod (port 80)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no root@$SSH_HOST << 'ENDSSH'
          set -e
          cd /opt/messenger
          git fetch origin
          git reset --hard origin/main
          docker compose -f docker-compose.yml down --remove-orphans || true
          docker compose -f docker-compose.yml up --build -d
          timeout 90 sh -c 'until curl -s http://127.0.0.1:8080/api/auth/login -X POST -H "Content-Type: application/json" -d "{}" 2>/dev/null | grep -qE "error|token|credentials|identifier"; do sleep 3; done' || (docker compose -f docker-compose.yml logs php --tail=60 && exit 1)
          docker compose -f docker-compose.yml exec -T php php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          ENDSSH
          rm -f /tmp/deploy_key
