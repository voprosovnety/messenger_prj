#cloud-config
# Timeweb Cloud → Ubuntu 22.04/24.04, регион DE
# Hostname: chat
# Запускает весь стек + Caddy с HTTPS через sslip.io (сертификат Let's Encrypt)
#
# Если репозиторий приватный — замени URL клонирования на:
#   https://<YOUR_GITHUB_TOKEN>@github.com/voprosovnety/messenger_prj.git

hostname: chat
locale: en_US.UTF-8
timezone: Europe/Berlin

# Публичные ключи для root (безопасно коммитить — это НЕ приватные ключи)
# Получить свой публичный ключ: ssh-keygen -y -f ~/.ssh/<key>
ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBZAo7KlybSdH/vR9nGjFzo222+J+2AvPU4gXLrpAciE danyawalker11@gmail.com

package_update: true
package_upgrade: false

packages:
  - git
  - curl
  - ca-certificates
  - gnupg
  - ufw
  - openssl

write_files:
  - path: /etc/systemd/system/messenger.service
    content: |
      [Unit]
      Description=Messenger
      Requires=docker.service
      After=docker.service network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/messenger
      ExecStart=/usr/bin/docker compose -f docker-compose.yml up -d
      ExecStop=/usr/bin/docker compose -f docker-compose.yml down
      TimeoutStartSec=300

      [Install]
      WantedBy=multi-user.target

  - path: /opt/setup.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -eo pipefail
      log() { echo "[setup] $*"; }

      # ── Docker (официальный репозиторий) ──────────────────────
      log "Installing Docker..."
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
      https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
        > /etc/apt/sources.list.d/docker.list

      # ── Caddy (официальный репозиторий) ───────────────────────
      log "Installing Caddy..."
      curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
        | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
        > /etc/apt/sources.list.d/caddy-stable.list

      apt-get update -qq
      apt-get install -y \
        docker-ce docker-ce-cli containerd.io docker-compose-plugin caddy

      # ── Firewall ───────────────────────────────────────────────
      log "Configuring UFW..."
      ufw --force enable
      ufw allow OpenSSH
      ufw allow 80/tcp
      ufw allow 443/tcp

      # ── Репозиторий ────────────────────────────────────────────
      log "Cloning repo..."
      git clone https://github.com/voprosovnety/messenger_prj.git /opt/messenger
      git clone https://github.com/voprosovnety/messenger_prj.git /opt/messenger-dev

      # ── Публичный IP → sslip.io домен ─────────────────────────
      log "Detecting public IP..."
      IP=$(curl -sf --retry 5 --retry-delay 3 https://api.ipify.org \
           || curl -sf https://ifconfig.me)
      DOMAIN="${IP//./-}.sslip.io"
      log "Domain: https://${DOMAIN}"

      # ── .env prod ─────────────────────────────────────────────
      SECRET=$(openssl rand -hex 32)
      printf 'MERCURE_JWT_SECRET=%s\nMERCURE_PUBLIC_URL=https://%s/.well-known/mercure\nNGINX_PORT=127.0.0.1:8080\nAPP_ENV=prod\nANTHROPIC_API_KEY=\n' \
        "${SECRET}" "${DOMAIN}" > /opt/messenger/.env

      # ── .env dev ──────────────────────────────────────────────
      DEV_DOMAIN="dev.${DOMAIN}"
      DEV_SECRET=$(openssl rand -hex 32)
      printf 'MERCURE_JWT_SECRET=%s\nMERCURE_PUBLIC_URL=https://%s/.well-known/mercure\nNGINX_PORT=127.0.0.1:8081\nAPP_ENV=prod\nANTHROPIC_API_KEY=\n' \
        "${DEV_SECRET}" "${DEV_DOMAIN}" > /opt/messenger-dev/.env

      # ── Caddyfile (prod + dev) ────────────────────────────────
      printf '%s {\n    reverse_proxy localhost:8080\n}\n\n%s {\n    reverse_proxy localhost:8081\n}\n' \
        "${DOMAIN}" "${DEV_DOMAIN}" > /etc/caddy/Caddyfile
      systemctl enable --now caddy

      # ── Systemd: автозапуск после ребута ──────────────────────
      systemctl daemon-reload
      systemctl enable messenger

      # ── Сборка и запуск (3-5 мин) ─────────────────────────────
      log "Building images and starting containers..."
      cd /opt/messenger
      docker compose -f docker-compose.yml up -d --build
      log "Waiting for PHP-FPM..."
      timeout 120 sh -c 'until docker compose -f /opt/messenger/docker-compose.yml exec -T php php bin/console about > /dev/null 2>&1; do sleep 5; done'
      log "Waiting for PostgreSQL..."
      timeout 60 sh -c 'until docker compose -f /opt/messenger/docker-compose.yml exec -T postgres pg_isready > /dev/null 2>&1; do sleep 3; done'
      docker compose -f docker-compose.yml exec -T php php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      log "Migrations done."

      log ""
      log "============================================================"
      log "  Prod: https://${DOMAIN}"
      log "  Dev:  https://${DEV_DOMAIN}  (деплоится CI/CD)"
      log ""
      log "  Anthropic API key:"
      log "    nano /opt/messenger/.env && systemctl restart messenger"
      log "    nano /opt/messenger-dev/.env  (для dev)"
      log ""
      log "  Логи: tail -f /var/log/messenger-setup.log"
      log "  Логи контейнеров: docker compose -f /opt/messenger/docker-compose.yml logs -f"
      log "============================================================"

runcmd:
  - bash /opt/setup.sh 2>&1 | tee /var/log/messenger-setup.log
