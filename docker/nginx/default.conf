# 5 login attempts per minute per IP before throttling
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 50m;

    # Static file uploads
    location /uploads/ {
        alias /var/www/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Mercure SSE
    location /.well-known/mercure {
        proxy_pass http://mercure/.well-known/mercure;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }

    # Rate-limited login endpoint (exact match, higher priority than the regex below)
    location = /api/auth/login {
        root /var/www/backend/app/public;
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        try_files $uri @php;
    }

    # Symfony API + Swagger
    location ~ ^/(api|_wdt|_profiler) {
        root /var/www/backend/app/public;
        try_files $uri @php;
    }

    location @php {
        root /var/www/backend/app/public;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Vue SPA
    location / {
        root /var/www/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
