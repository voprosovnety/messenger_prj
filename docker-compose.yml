services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - php
      - mercure
    volumes:
      - uploads:/var/www/uploads
    restart: unless-stopped

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/backend/app
    volumes:
      - jwt_keys:/var/www/backend/app/config/jwt
      - uploads:/var/www/uploads
    environment:
      APP_ENV: ${APP_ENV:-dev}
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}
      MERCURE_JWT_SECRET: $MERCURE_JWT_SECRET
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messenger}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  mercure:
    image: dunglas/mercure:latest
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: $MERCURE_JWT_SECRET
      MERCURE_SUBSCRIBER_JWT_KEY: $MERCURE_JWT_SECRET
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${CORS_ORIGINS:-*}
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /var/www/backend/app
    command: ["php", "bin/console", "app:scheduled-messages:dispatch", "--loop", "--interval", "30"]
    volumes:
      - jwt_keys:/var/www/backend/app/config/jwt
      - uploads:/var/www/uploads
    environment:
      APP_ENV: ${APP_ENV:-dev}
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}
      MERCURE_JWT_SECRET: $MERCURE_JWT_SECRET
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - postgres
      - mercure
    restart: unless-stopped

volumes:
  pgdata:
  jwt_keys:
  uploads:
